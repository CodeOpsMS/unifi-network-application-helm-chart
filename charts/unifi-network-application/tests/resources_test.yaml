suite: Java memory headroom and startup budget
release:
  name: validation
templates:
  - deployment.yaml
values:
  - ../ci/default-values.yaml
tests:
  - it: reserves native memory above the maximum Java heap
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEM_STARTUP
            value: "512"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEM_LIMIT
            value: "1024"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1536Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
  - it: checks semantic readiness instead of accepting every HTTP 200 response
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command[0]
          value: /bin/sh
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command[1]
          value: -ec
      - matchRegex:
          path: spec.template.spec.containers[0].startupProbe.exec.command[2]
          pattern: https://127[.]0[.]0[.]1:8443/status
      - matchRegex:
          path: spec.template.spec.containers[0].startupProbe.exec.command[2]
          pattern: jq --exit-status
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 90
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe.timeoutSeconds
          value: 5
  - it: allows operators to tune slow database and startup timing
    set:
      probes.startup.failureThreshold: 120
      probes.readiness.timeoutSeconds: 8
      probes.liveness.periodSeconds: 60
      terminationGracePeriodSeconds: 120
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 120
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 8
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 60
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
  - it: rejects a heap exceeding its container headroom
    set:
      resources.limits.memory: 1Gi
    asserts:
      - failedTemplate:
          errorMessage: resources.limits.memory must allow at least 512 MiB above java.maxHeapMiB
  - it: rejects a startup heap above the maximum
    set:
      java.initialHeapMiB: 2048
    asserts:
      - failedTemplate:
          errorMessage: java.initialHeapMiB must not exceed java.maxHeapMiB
  - it: rejects memory requests above the limit
    set:
      resources.requests.memory: 3Gi
    asserts:
      - failedTemplate:
          errorMessage: resources.requests.memory must not exceed resources.limits.memory
  - it: accepts equal CPU expressed in cores and millicores
    set:
      resources.requests.cpu: 1500m
      resources.limits.cpu: "1.5"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 1500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1.5"
  - it: accepts numeric CPU without a floating point rounding rejection
    set:
      resources.requests.cpu: 0.3
      resources.limits.cpu: 300m
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 0.3
  - it: rejects CPU requests above the limit
    set:
      resources.requests.cpu: "3"
      resources.limits.cpu: "2"
    asserts:
      - failedTemplate:
          errorMessage: resources.requests.cpu must not exceed resources.limits.cpu
  - it: rejects a CPU request one millicore above a fractional core limit
    set:
      resources.requests.cpu: 501m
      resources.limits.cpu: 0.5
    asserts:
      - failedTemplate:
          errorMessage: resources.requests.cpu must not exceed resources.limits.cpu
