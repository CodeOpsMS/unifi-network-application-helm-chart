# Include within NGINX's http {} context; replace hostnames, paths and upstream.
# This is browser/API proxying only. Inform TCP 8080 and STUN UDP 3478 need
# separate reachability and must not be redirected through this web server.
map $http_upgrade $unifi_connection_upgrade {
    default upgrade;
    '' close;
}

upstream unifi_web {
    # Replace with a LoadBalancer address reachable from this NGINX server.
    # A ClusterIP works only when NGINX can route into the cluster Service CIDR.
    server 192.0.2.50:8443;
}

server {
    listen 80;
    server_name unifi.example.com;
    return 301 https://unifi.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name unifi.example.com;

    ssl_certificate /etc/nginx/tls/unifi/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/unifi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;

    location / {
        proxy_pass https://unifi_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $unifi_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # The default container certificate is self-signed. This setting keeps
        # HTTPS encryption but does not authenticate the backend certificate.
        # If you install a trusted upstream certificate, configure its CA and
        # name here and turn verification on instead.
        proxy_ssl_verify off;
    }
}
