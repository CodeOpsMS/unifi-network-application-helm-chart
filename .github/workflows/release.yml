name: Publish tested chart

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft release with tested archive and reports
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: chart-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.version }}
      - name: Install pinned tools
        run: ./scripts/bootstrap-tools.sh
      - name: Download tested artifacts and publish without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source .tools/env.sh
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p build/release-input
          gh release download "$RELEASE_VERSION" --dir build/release-input
          python3 scripts/release.py publish \
            --package "build/release-input/unifi-network-application-${RELEASE_VERSION}.tgz" \
            --summary build/release-input/summary.json \
            --validation build/release-input/validation.json
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages-site
      - name: Deploy Pages
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify Pages bytes and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package="unifi-network-application-${RELEASE_VERSION}.tgz"
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 \
            "https://codeopsms.github.io/unifi-network-application-helm-chart/${package}" \
            --output build/pages-download.tgz
          cmp "build/release-input/${package}" build/pages-download.tgz
          gh release edit "$RELEASE_VERSION" --draft=false
